[workspace]
members = ["crates/sudoku-core", "crates/sudoku-cli", "crates/sudoku-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sudoku-core = { path = "crates/sudoku-core" }

# Profiles only take effect at the workspace root.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
