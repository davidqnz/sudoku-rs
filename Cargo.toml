[package]
name = "sudoku-rs"
version = "0.1.0"
edition = "2024"

[dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[[bench]]
name = "solver"
harness = false

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
